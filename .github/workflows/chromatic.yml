name: "Chromatic"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

defaults:
  run:
    shell: bash
    working-directory: "application"

# main への push (Chromatic ベースライン) は並列キャンセルしない。
# PR の push 連投時のみ古いランをキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    # dependabot PR でもジョブは実行し、chromaui/action の skip: "dependabot**" で
    # ビルドはスキップしつつ Run Chromatic / UI Review / UI Tests を pass として投稿する。
    # ジョブ自体を除外すると必須チェックが未報告のままになり auto-merge がブロックされるため。
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: chromaui/action@80379940a37537422d4419aa4c9578673b8bcd34 # v18.13.9
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          skip: "dependabot**"
          workingDir: "application"
          exitOnceUploaded: true
          autoAcceptChanges: "main"
