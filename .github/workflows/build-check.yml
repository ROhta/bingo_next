name: Build Check

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - main

# デフォルトシェルでパイプエラーを有効化
defaults:
  run:
    shell: bash
    working-directory: "application"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Dependency-Review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  Build-Check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      # mise.toml（SSoT）と 2 つの package.json の pnpm 版が乖離していないことを検証する。
      # composite action ではなくこのワークフローに置く: composite action に入れると
      # chromatic.yml からも走り、main への push でベースラインジョブまで赤くなるため。
      # check-versions は package.json / application/package.json をリポジトリルート相対で
      # 参照する。mise タスクは mise.toml のあるディレクトリで実行される仕様だが、
      # 上の defaults.run.working-directory: "application" に紛れないよう明示する。
      - name: Check version drift
        working-directory: ${{ github.workspace }}
        run: mise run check-versions
      # Dependabot PR は pre-commit hook を通らないため、lint-staged は依存更新を
      # 一切検証できない。ここで lint を実行しないと ESLint を壊す依存更新が
      # 無検証で main に入る (#733 の TypeScript 7 更新が 2 週間気付かれなかった原因)。
      # Build-Check は ruleset の必須チェックなので、この job のステップとして追加する。
      # 別 job にすると非必須チェックになり auto-merge のフォールバックを止められない。
      # timeout-minutes を 5 にしているのは lint の所要時間 (実測 11 秒) のためではなく、
      # permissions monitor ステップが単体で 52 秒 (job 全体の 40%) を占めており、
      # ここの変動や pnpm キャッシュミスで 3 分を超える余地があるため。
      - name: Lint
        run: pnpm lint
      - name: Run Tests
        run: pnpm test -- --run
      - name: Build
        run: pnpm run build
        env:
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: "1"
