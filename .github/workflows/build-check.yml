name: Build Check

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - main

# デフォルトシェルでパイプエラーを有効化
defaults:
  run:
    shell: bash
    working-directory: "application"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Dependency-Review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  Build-Check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      # mise.toml（SSoT）と 2 つの package.json の pnpm 版が乖離していないことを検証する。
      # composite action ではなくこのワークフローに置く: composite action に入れると
      # chromatic.yml からも走り、main への push でベースラインジョブまで赤くなるため。
      # mise タスクは mise.toml のあるリポジトリルートで実行されるので、
      # 上の defaults.run.working-directory: "application" の影響は受けない。
      - name: Check version drift
        run: mise run check-versions
      - name: Run Tests
        run: pnpm test -- --run
      - name: Build
        run: pnpm run build
        env:
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: "1"
