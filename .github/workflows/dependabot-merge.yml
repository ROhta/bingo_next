name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.sender.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      - id: auto-merge
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        continue-on-error: true
        with:
          use-github-auto-merge: true
          target: "minor"
      # 必須チェックが全て完走した後に auto-merge の予約 API が呼ばれると
      # GitHub は「予約不要」として拒否する (unstable status) ため、直接マージにフォールバックする。
      # ただし action は target を超える更新の拒否でも失敗するため、outcome だけを条件にすると
      # target: minor の制約を迂回して major をマージしてしまう。更新種別を独立に取得し、
      # minor / patch のみを許可する allowlist で判定する
      - id: metadata
        if: steps.auto-merge.outcome == 'failure'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: 直接マージへのフォールバック
        if: >-
          steps.auto-merge.outcome == 'failure'
          && contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --squash "${{ github.event.pull_request.number }}"

  # Dependabot PR に Dependabot 以外がコミットを追加した場合は自動マージ予約を解除し、人手レビューに戻す
  # (依存定義ファイルはコードオーナー不在のため、予約が残ると人のコミットが無レビューでマージされる)
  disable-auto-merge:
    if: >-
      github.event.action == 'synchronize'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.sender.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1.0.2-beta9
        with:
          config: ${{ vars.PERMISSIONS_CONFIG }}
      # Update branch (GitHub 上での main 取り込み) は内容の修正ではないため予約を維持する。
      # PR の全コミット (base との差分) が GitHub 上で作成 (committer: web-flow) され、かつ
      # マージコミット以外が Dependabot 作成の場合のみ許可する。
      # ローカルからの push・amend・rebase・ブラウザ編集は解除対象。比較に失敗した場合も安全側に倒して解除する
      - name: 自動マージ予約の解除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 一覧が打ち切られた (total_commits と件数が不一致) 場合や署名未検証のコミットがある場合も解除対象
          unexpected=$(gh api "repos/$GH_REPO/compare/$BASE_REF...$HEAD_SHA" --jq '
            if .total_commits != (.commits | length) then "truncated" else
            [.commits[] | select(
              .committer.login != "web-flow"
              or .commit.verification.verified != true
              or ((.parents | length) == 1 and .author.login != "dependabot[bot]")
            )] | length end' || echo error)
          if [ "$unexpected" = "0" ]; then
            echo "main の取り込みのみのため自動マージ予約を維持"
          else
            gh pr merge --disable-auto "$PR_NUMBER"
          fi
