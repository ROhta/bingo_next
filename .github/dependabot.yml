version: 2
updates:
  - package-ecosystem: "npm"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Tokyo"
    directory: "/application"
    allow:
      - dependency-type: "all"
    cooldown:
      semver-major-days: 30
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    versioning-strategy: increase
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
      # TypeScript はエコシステムの対応が追いついていない。
      # ts-api-utils が TypeScript 7 で動かず ESLint が起動不能になり、
      # @joshwooding/vite-plugin-react-docgen-typescript も未対応で Storybook が壊れる。
      # typescript-eslint の peerDependencies も `typescript: '>=4.8.4 <6.1.0'` であり
      # 6.1 系も範囲外になるため、minor 以上の更新を見送り手動で追随する。
      # Build-Check は lint を実行しないため、この種の破損は CI で検出できない。
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      npm-all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "terraform"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 10
    directories:
      - "/iac/**"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    groups:
      terraform-all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 10
    directories:
      - "/"
      - "/.github/actions/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "_"
    rebase-strategy: "auto"
    groups:
      github-all-dependencies:
        patterns:
          - "*"
