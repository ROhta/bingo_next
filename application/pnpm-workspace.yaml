# next が postcss を exact pin (8.4.31) で引き込むため、直接依存の postcss@8.5.x と
# 併存し 8.4.31 側に脆弱性アラートが残り続ける (GHSA-qx2v-qp2m-jg93 / GHSA-6g55-p6wh-862q /
# GHSA-r28c-9q8g-f849)。直接依存を上げても next 配下は動かないため、next 配下だけを
# 直接依存と同じレンジへ寄せて postcss を 1 バージョンに統一する。
# next が pin を上げたらこの override は不要になる。
#
# next が sharp を ^0.34.5 で引き込むが、0.x の caret はマイナー固定なので libvips 由来の
# 脆弱性 (CVE-2026-33327 / CVE-2026-33328 / CVE-2026-35590 / CVE-2026-35591) が修正された
# 0.35.0 以降に到達できない。sharp は next 経由の本番依存で Snyk の PR チェックを落とすため、
# next@16.3.0 が採用しているレンジ (^0.35.3) へ寄せる。
# next を 16.3.0 以降へ上げたらこの override は不要になる。
overrides:
  next>postcss: "^8.5.23"
  next>sharp: "^0.35.3"

allowBuilds:
  "@vercel/speed-insights": true
  esbuild: true
  sharp: true
  core-js-pure: false
  msw: false
  unrs-resolver: false
